name: Deploy

# main    -> production (airsoft.tangle.care)
# staging -> staging    (airsoft-staging.tangle.care)
#
# Repository secrets:   SSH_HOST, SSH_USER, SSH_PRIVATE_KEY, SSH_KNOWN_HOSTS
# Optional environment variable DEPLOY_PATH overrides the checkout path on the server.
on:
  push:
    branches: [main, staging]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            webapp/package-lock.json
      - name: Backend syntax check
        run: |
          npm ci
          find . -name '*.js' -not -path './node_modules/*' -not -path './webapp/*' -print0 | xargs -0 -n1 node --check
      - name: Build webapp
        working-directory: webapp
        run: |
          npm ci
          npm run build

  deploy:
    needs: check
    if: github.ref_name == 'main' || github.ref_name == 'staging'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    env:
      APP_ENV: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || (github.ref_name == 'main' && '/home/tangle-care/airsoft_html/airsoft-app' || '/home/tangle-care/airsoftstaging_html/airsoft-app') }}
    steps:
      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_PATH" || { echo "DEPLOY_PATH variable is not set for this environment"; exit 1; }
          install -m 700 -d ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy on server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" bash -s -- \
            "$DEPLOY_PATH" "$GITHUB_REF_NAME" "$GITHUB_SHA" "$APP_ENV" <<'REMOTE'
          set -euo pipefail
          cd "$1"
          git fetch --prune origin "$2"
          git reset --hard "$3"
          bash deploy/remote-deploy.sh "$4" "${3:0:7}"
          REMOTE
